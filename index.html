<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartografia das Vocações da Moda em Passos-MG</title>

  <style>
    /* Estilos provisórios para organizar a página. */
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #333333;
      background-color: #f7f5f0;
    }

    header, main {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      padding-bottom: 16px;
      border-bottom: 1px solid #d8d3c9;
    }

    nav a {
      margin-right: 16px;
      color: #555555;
    }

    main {
      padding-top: 24px;
    }

    .area-futura {
      min-height: 180px;
      margin-top: 24px;
      border: 1px dashed #bdb7aa;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cartografia das Vocações da Moda em Passos-MG</h1>

    <nav aria-label="Menu principal">
      <a href="#inicio">Início</a>
      <a href="#mapeamento">Mapeamento</a>
      <a href="#sobre">Sobre</a>
    </nav>
  </header>

  <main id="inicio">
    <section id="sobre">
      <h2>Sobre o projeto</h2>
      <p>Este projeto busca mapear os agentes e as vocações da moda no município de Passos-MG.</p>
    </section>

    <section id="mapeamento" class="area-futura" aria-label="Área reservada para conteúdo futuro">
    </section>
  </main>
</body>
</html>
